name: loggistics_server

on:
  push:
    branches:
      - main

jobs:
  # Never deploy code that fails the malware guard: the deploy runs
  # `npm ci && npm run build` as root on the server.
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/security/scan-malware.cjs

  deploy:
    needs: malware-scan
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24.22.1

            cd /var/www/loggis/backend

            git pull origin main
            node scripts/security/scan-malware.cjs || exit 1
            npm ci
            npm run build

            pm2 restart loggis_server --update-env
