name: loggistics_server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24.22.1

            cd /var/www/loggis/backend
            git pull origin main
            npm ci
            npm run build
            pm2 restart loggis_server --update-env